    <title>Kevin's Dashboard</title>
    <style>
        body {
            background-color: #f8f9fa;
            margin: 0;
            padding: 4px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 3px 1px;
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }
        .icon-link {
            text-decoration: none;
            color: #444;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.1s, background-color 0.2s;
            padding: 10px;
            border-radius: 12px;
        }
        .icon-link:hover {
            background-color: #e9ecef;
            transform: translateY(-2px);
        }
        .icon-link:active { 
            transform: scale(0.95); 
        }
        .icon-link img {
            width: 56px;
            height: 56px;
            border-radius: 10px;
            margin-bottom: 10px;
            object-fit: contain;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 4px; 
        }
        .icon-link span {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            text-transform: capitalize; /* Automatically capitalizes the filename */
        }
    </style>
</head>
